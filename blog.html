---
layout: default
title: Blog
---
<ul class="paper-list">
    {% for post in site.posts %}
    <li>
        <h4><a href="{{ post.url | relative_url }}">{{ post.title }}</a></h4>
        <p>{{ post.description }}</p>
    </li>
    {% else %}
    <li>No posts yet. Check back soon.</li>
    {% endfor %}
</ul>
